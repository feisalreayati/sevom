<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بازی حافظه تصویری کودکان</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Tahoma,Arial,sans-serif;
 background:linear-gradient(135deg,#ff9a9e,#fad0c4);
 color:#333;text-align:center;padding:15px
}
.container{max-width:1100px;margin:auto}
h1{color:#6a1b9a;text-shadow: 2px 2px 4px rgba(0,0,0,0.1)}
.panel{
 background:white;padding:18px;border-radius:20px;
 margin:15px auto;box-shadow:0 8px 25px rgba(0,0,0,0.15)
}
.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.stat{background:#f3e5f5;padding:12px 18px;border-radius:14px;font-weight:bold;color:#4a148c}
button{
 border:0;border-radius:14px;padding:12px 20px;
 background:linear-gradient(135deg,#8e44ad,#9b59b6);color:white;font-size:15px;
 cursor:pointer;margin:6px;box-shadow:0 4px 10px rgba(0,0,0,0.2);transition:0.2s
}
button:hover{transform:translateY(-2px);opacity:.9}
button:active{transform:translateY(0)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}
/* تغییر به ۸ ستون در هر ردیف */
.grid{
 display:grid;grid-template-columns:repeat(8,minmax(45px,1fr));
 gap:8px;max-width:850px;margin:20px auto
}
.card{
 aspect-ratio:1/1;background:linear-gradient(135deg,#6c5ce7,#a29bfe);border-radius:14px;
 display:flex;align-items:center;justify-content:center;
 cursor:pointer;font-size:clamp(22px,5vw,38px);
 box-shadow:0 4px 8px rgba(0,0,0,0.15);overflow:hidden;
 user-select:none;transition:0.3s
}
.card:hover{transform:scale(1.03)}
.card.open,.card.matched{background:white;border:3px solid #6c5ce7}
.card.matched{border-color:#00b894;background:#e8f8f5;animation:pulse 0.5s}
@keyframes pulse {
 0%{transform:scale(1)}
 50%{transform:scale(1.1)}
 100%{transform:scale(1)}
}
.card img{width:80%;height:80%;object-fit:contain}
.hidden{display:none}
input{padding:10px;border:2px solid #ddd;border-radius:9px;margin:5px;width:80%;max-width:300px}
#message{font-weight:bold;color:#4a148c;min-height:30px;font-size:18px;margin:10px 0}
.admin-list{
 display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
 gap:10px;margin-top:15px
}
.admin-item{background:#f8f9fa;padding:10px;border-radius:14px;box-shadow:0 2px 5px rgba(0,0,0,0.05)}
.admin-item img{width:60px;height:60px;object-fit:contain;border-radius:8px}
@media(max-width:500px){
 .grid{gap:5px}
 .card{border-radius:8px}
}
</style>
</head>
<body>
<div class="container">
<h1>🎈 بازی حافظه تصویری کودکان 🎈</h1>
<p>دو تصویر یکسان را پیدا کن و امتیاز بگیر!</p>

<div class="panel">
 <div class="stats">
  <div class="stat">⭐ امتیاز: <b id="score">0</b></div>
  <div class="stat">🎯 تلاش: <b id="attempts">0</b></div>
  <div class="stat">⏱ زمان: <b id="timer">0</b> ثانیه</div>
  <div class="stat">✅ جفت‌ها: <b id="pairs">0</b> از <b id="total">24</b></div>
 </div>
 <button onclick="startGame()">شروع بازی جدید 🔄</button>
 <button id="peekBtn" onclick="peekCards()">👀 راهنمایی (۳ ثانیه دیدن)</button>
 <button onclick="showTab('game')">صفحه بازی</button>
 <button onclick="showTab('admin')">مدیریت تصاویر ⚙️</button>
</div>

<div id="game">
 <div id="message">برای شروع بازی روی دکمه شروع بزن.</div>
 <div class="grid" id="board"></div>
</div>

<div id="admin" class="panel hidden">
 <h2>🖼 مدیریت تصاویر</h2>
 <p>تصاویر دلخواه خود را اضافه کنید. هر تصویر دو کارت همسان می‌سازد.</p>
 <input type="file" id="imageInput" accept="image/*" multiple>
 <br>
 <button onclick="addImages()">افزودن تصاویر</button>
 <button onclick="resetImages()">بازگشت به تصاویر پیش‌فرض</button>
 <div id="adminList" class="admin-list"></div>
</div>
</div>

<script>
// افزایش تعداد آیتم‌ها به ۲۴ عدد برای چیدمان جذاب‌تر ۸تایی
const defaults=[
 ["🐱","گربه"],["🐶","سگ"],["🦁","شیر"],["🐸","قورباغه"],
 ["🐼","پاندا"],["🐵","میمون"],["🐰","خرگوش"],["🦊","روباه"],
 ["🐻","خرس"],["🐯","ببر"],["🍎","سیب"],["🍌","موز"],
 ["🍓","توت‌فرنگی"],["🍇","انگور"],["🍉","هندوانه"],
 ["🚗","ماشین"],["✈️","هواپیما"],["⚽","توپ"],
 ["🌞","خورشید"],["⭐","ستاره"],["🦄","اسب تک‌شاخ"],
 ["🚀","موشک"],["🍦","بستنی"],["🎨","پالت نقاشی"]
];

const STORAGE="memory_game_pair_v5";
let items=[];
let cards=[],first=null,second=null,locked=false;
let score=0,attempts=0,found=0,seconds=0;
let timer=null,started=false;

function uid(){
 return "pair_"+Date.now()+"_"+Math.random().toString(36).slice(2);
}
function loadItems(){
 try{
  const saved=localStorage.getItem(STORAGE);
  items=saved?JSON.parse(saved):[];
 }catch(e){items=[]}
 if(!items.length) resetImages(false);
}
function saveItems(){
 localStorage.setItem(STORAGE,JSON.stringify(items));
}
function resetImages(save=true){
 items=defaults.map(([emoji,name])=>({
  id:uid(),name,emoji,src:null
 }));
 if(save) saveItems();
 renderAdmin();
 startGame();
}
function makeCards(){
 const result=[];
 items.forEach(item=>{
  result.push({pairId:item.id,item});
  result.push({pairId:item.id,item});
 });
 return result.sort(()=>Math.random()-.5);
}
function startGame(){
 clearInterval(timer);
 cards=makeCards();
 first=null;second=null;locked=false;
 score=0;attempts=0;found=0;seconds=0;started=false;
 document.getElementById("peekBtn").disabled=false;
 updateStats();
 document.getElementById("message").textContent="کارت‌ها را انتخاب کن و جفت‌های یکسان را پیدا کن!";
 const board=document.getElementById("board");
 board.innerHTML="";
 cards.forEach((card,index)=>{
  const el=document.createElement("div");
  el.className="card";
  renderCardContent(el, card, true);
  el.dataset.index=index;
  el.onclick=()=>flipCard(index,el);
  board.appendChild(el);
 });
 document.getElementById("total").textContent=items.length;
}

function renderCardContent(el, card, hidden){
 el.innerHTML="";
 if(hidden){
  el.textContent="❓";
  el.style.background="linear-gradient(135deg,#6c5ce7,#a29bfe)";
 } else {
  el.style.background="white";
  if(card.item.src){
   const img=document.createElement("img");
   img.src=card.item.src;
   el.appendChild(img);
  }else{
   el.textContent=card.item.emoji;
  }
 }
}

// دکمه ۳ ثانیه دیدن کارت‌ها
function peekCards(){
 if(locked || found===items.length) return;
 locked=true;
 document.getElementById("peekBtn").disabled=true;
 document.getElementById("message").textContent="👀 دقت کن! ۳ ثانیه فرصت داری کارت‌ها رو ببینی...";
 
 const cardElements=document.querySelectorAll(".card");
 cards.forEach((card, idx)=>{
  renderCardContent(cardElements[idx], card, false);
 });

 setTimeout(()=>{
  cards.forEach((card, idx)=>{
   const el=cardElements[idx];
   if(!el.classList.contains("matched") && !el.classList.contains("open")){
    renderCardContent(el, card, true);
   }
  });
  locked=false;
  document.getElementById("message").textContent="حالا بازی رو ادامه بده! 😊";
 }, 3000);
}

function flipCard(index,el){
 if(locked||el.classList.contains("open")||el.classList.contains("matched"))return;
 if(!started){
  started=true;
  timer=setInterval(()=>{
   seconds++;
   updateStats();
  },1000);
 }
 const card=cards[index];
 el.classList.add("open");
 renderCardContent(el, card, false);

 if(!first){
  first={card,el};
  return;
 }
 second={card,el};
 attempts++;
 if(first.card.pairId===second.card.pairId){
  first.el.classList.add("matched");
  second.el.classList.add("matched");
  score+=100;found++;
  first=null;second=null;
  updateStats();
  if(found===items.length){
   clearInterval(timer);
   document.getElementById("message").textContent=
    "🎉 آفرین! همه جفت‌ها را پیدا کردی! امتیاز تو: "+score;
   document.getElementById("peekBtn").disabled=true;
  }else{
   document.getElementById("message").textContent="👏 آفرین! یک جفت درست پیدا کردی.";
  }
 }else{
  locked=true;
  document.getElementById("message").textContent="دوباره تلاش کن! 😊";
  setTimeout(()=>{
   first.el.classList.remove("open");
   second.el.classList.remove("open");
   renderCardContent(first.el, first.card, true);
   renderCardContent(second.el, second.card, true);
   first=null;second=null;locked=false;
  },850);
 }
 updateStats();
}
function updateStats(){
 document.getElementById("score").textContent=score;
 document.getElementById("attempts").textContent=attempts;
 document.getElementById("pairs").textContent=found;
 document.getElementById("timer").textContent=seconds;
}
function showTab(tab){
 document.getElementById("game").classList.toggle("hidden",tab!=="game");
 document.getElementById("admin").classList.toggle("hidden",tab!=="admin");
 if(tab==="admin")renderAdmin();
}
function addImages(){
 const files=[...document.getElementById("imageInput").files];
 if(!files.length){alert("ابتدا تصویر انتخاب کن.");return}
 if(items.length+files.length>60){
  alert("حداکثر ۶۰ تصویر می‌توانی اضافه کنی.");return;
 }
 let remaining=files.length;
 files.forEach(file=>{
  if(!file.type.startsWith("image/")){
   remaining--;
   return;
  }
  const reader=new FileReader();
  reader.onload=()=>{
   items.push({
    id:uid(),name:file.name,emoji:"🖼️",src:reader.result
   });
   remaining--;
   if(remaining===0){
    saveItems();renderAdmin();startGame();
    document.getElementById("imageInput").value="";
    alert("تصاویر اضافه شدند.");
   }
  };
  reader.onerror=()=>{
   remaining--;
   if(remaining===0)alert("خواندن بعضی تصاویر ناموفق بود.");
  };
  reader.readAsDataURL(file);
 });
}
function deleteItem(id){
 if(!confirm("این تصویر و جفت آن حذف شود؟"))return;
 items=items.filter(x=>x.id!==id);
 saveItems();renderAdmin();startGame();
}
function renderAdmin(){
 const list=document.getElementById("adminList");
 if(!list)return;
 list.innerHTML="";
 items.forEach(item=>{
  const div=document.createElement("div");
  div.className="admin-item";
  if(item.src){
   const img=document.createElement("img");
   img.src=item.src;div.appendChild(img);
  }else{
   const emoji=document.createElement("div");
   emoji.style.fontSize="35px";
   emoji.textContent=item.emoji;div.appendChild(emoji);
  }
  const name=document.createElement("div");
  name.textContent=item.name;
  div.appendChild(name);
  const del=document.createElement("button");
  del.textContent="حذف";
  del.onclick=()=>deleteItem(item.id);
  div.appendChild(del);
  list.appendChild(div);
 });
}
loadItems();
renderAdmin();
startGame();
</script>
</body>
</html>
